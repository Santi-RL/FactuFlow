# Propuestas de actualización; revisión manual y CI obligatoria antes del merge.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    groups:
      # Vitest y su proveedor de cobertura requieren versiones coordinadas.
      vitest:
        applies-to: "version-updates"
        patterns:
          - "vitest"
          - "@vitest/*"
      vitest-security:
        applies-to: "security-updates"
        patterns:
          - "vitest"
          - "@vitest/*"
      eslint:
        applies-to: "version-updates"
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "vue-eslint-parser"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    groups:
      pytest:
        applies-to: "version-updates"
        patterns:
          - "pytest"
          - "pytest-*"
          - "coverage"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 2
    groups:
      acciones:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
