name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Change Scope
    runs-on: ubuntu-latest
    outputs:
      level0: ${{ steps.classify.outputs.level0 }}
      runtime: ${{ steps.classify.outputs.runtime }}
      changed_count: ${{ steps.classify.outputs.changed_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          git diff --name-only -z "$base_sha" "$HEAD_SHA" \
            | node tools/ci/change-scope.mjs >> "$GITHUB_OUTPUT"

      - name: Publish scope summary
        env:
          LEVEL_ZERO: ${{ steps.classify.outputs.level0 }}
          RUNTIME: ${{ steps.classify.outputs.runtime }}
          CHANGED_COUNT: ${{ steps.classify.outputs.changed_count }}
        run: |
          {
            echo "## Alcance de CI"
            echo "- Archivos modificados: $CHANGED_COUNT"
            echo "- Nivel 0 documental: $LEVEL_ZERO"
            echo "- Matriz de runtime requerida: $RUNTIME"
          } >> "$GITHUB_STEP_SUMMARY"

  repository:
    name: Repository Checks
    needs: scope
    runs-on: ubuntu-latest

    steps:
      - name: Nivel 0 documental
        if: needs.scope.outputs.runtime != 'true'
        run: echo "Cambio exclusivamente documental; no requiere tests de runtime."

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Check documentation alignment
        run: npm run docs:check

      - name: Run package script tests
        if: needs.scope.outputs.runtime == 'true'
        run: npm run test:scripts

      - name: Run Clawpatch seed tests
        if: needs.scope.outputs.runtime == 'true'
        run: npm run clawpatch:test-seeds

  backend:
    name: Backend Tests
    needs: scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Nivel 0 documental
        if: needs.scope.outputs.runtime != 'true'
        working-directory: .
        run: echo "Cambio exclusivamente documental; backend omitido."

      - name: Checkout
        if: needs.scope.outputs.runtime == 'true'
        uses: actions/checkout@v6

      - name: Setup Python
        if: needs.scope.outputs.runtime == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        if: needs.scope.outputs.runtime == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff
        if: needs.scope.outputs.runtime == 'true'
        run: ruff check app/ tests/

      - name: Check Black formatting
        if: needs.scope.outputs.runtime == 'true'
        run: black --check app/ tests/

      - name: Run tests
        if: needs.scope.outputs.runtime == 'true'
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload coverage
        if: needs.scope.outputs.runtime == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: backend/coverage.xml
          flags: backend
          use_oidc: true

  frontend:
    name: Frontend Build
    needs: scope
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Nivel 0 documental
        if: needs.scope.outputs.runtime != 'true'
        working-directory: .
        run: echo "Cambio exclusivamente documental; frontend omitido."

      - name: Checkout
        if: needs.scope.outputs.runtime == 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: needs.scope.outputs.runtime == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.scope.outputs.runtime == 'true'
        run: npm ci

      - name: Run type check
        if: needs.scope.outputs.runtime == 'true'
        run: npm run type-check

      - name: Run linting
        if: needs.scope.outputs.runtime == 'true'
        run: npm run lint:check

      - name: Build
        if: needs.scope.outputs.runtime == 'true'
        run: npm run build

      - name: Run unit tests
        if: needs.scope.outputs.runtime == 'true'
        run: npm run test:unit

  e2e:
    name: E2E Tests
    needs: [scope, repository, backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Nivel 0 documental
        if: needs.scope.outputs.runtime != 'true'
        run: echo "Cambio exclusivamente documental; E2E omitido."

      - name: Checkout
        if: needs.scope.outputs.runtime == 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: needs.scope.outputs.runtime == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.scope.outputs.runtime == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: needs.scope.outputs.runtime == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        if: needs.scope.outputs.runtime == 'true'
        working-directory: frontend
        run: npm run build

      - name: Run E2E tests
        if: needs.scope.outputs.runtime == 'true'
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium

      - name: Upload test results
        if: failure() && needs.scope.outputs.runtime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security:
    name: Security Audit
    needs: scope
    runs-on: ubuntu-latest

    steps:
      - name: Nivel 0 documental
        if: needs.scope.outputs.runtime != 'true'
        run: echo "Cambio exclusivamente documental; auditorías omitidas."

      - name: Checkout
        if: needs.scope.outputs.runtime == 'true'
        uses: actions/checkout@v6

      - name: Setup Python
        if: needs.scope.outputs.runtime == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Python dependencies
        if: needs.scope.outputs.runtime == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit -r requirements.txt

      - name: Setup Node.js
        if: needs.scope.outputs.runtime == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Check npm dependencies
        if: needs.scope.outputs.runtime == 'true'
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
